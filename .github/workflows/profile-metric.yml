name: GitHub-Profile-3D-Metric

on:
  # Refresh once a day so the card stays current without any pushes.
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Metrics embed

    # The action pushes the rendered SVG back to this repository itself.
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          # Personal access token, stored as a repository secret.
          # No scopes are required for the plugins enabled below.
          token: ${{ secrets.METRICS_TOKEN }}
          user: brady0127
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto

          # The 3D contribution calendar this workflow is named after.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
